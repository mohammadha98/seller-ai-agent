<div class="ui-field">
  @if (label) {
    <label class="ui-field__label" [attr.for]="resolvedId">
      {{ label }}
      @if (required) {
        <span class="ui-field__required" aria-hidden="true">*</span>
      }
    </label>
  }

  <div
    class="ui-select"
    [class.ui-select--sm]="size === 'sm'"
    [class.ui-select--md]="size === 'md'"
    [class.ui-select--lg]="size === 'lg'"
    [class.ui-select--invalid]="!!error"
    [class.ui-select--disabled]="disabled"
  >
    <select
      class="ui-select__control"
      [id]="resolvedId"
      [value]="value ?? ''"
      [attr.name]="name || null"
      [attr.aria-invalid]="error ? 'true' : null"
      [attr.aria-describedby]="describedBy"
      [attr.aria-required]="required ? 'true' : null"
      [disabled]="disabled"
      [required]="required"
      (change)="onChange($event)"
      (focus)="onFocus($event)"
      (blur)="onBlur($event)"
    >
      @if (placeholder) {
        <option value="" [disabled]="required" [selected]="!value">{{ placeholder }}</option>
      }
      @for (option of options; track option.value) {
        <option [value]="option.value" [disabled]="!!option.disabled" [selected]="option.value === value">
          {{ option.label }}
        </option>
      }
    </select>

    <svg
      class="ui-select__chevron"
      aria-hidden="true"
      viewBox="0 0 20 20"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="m6 8 4 4 4-4" />
    </svg>
  </div>

  @if (error) {
    <span class="ui-field__error" [id]="errorId">{{ error }}</span>
  } @else if (hint) {
    <span class="ui-field__hint" [id]="hintId">{{ hint }}</span>
  }
</div>
