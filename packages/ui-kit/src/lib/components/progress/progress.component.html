<div class="ui-progress">
  @if (label || showValue) {
    <div class="ui-progress__meta">
      @if (label) {
        <span class="ui-progress__label">{{ label }}</span>
      }
      @if (showValue && !indeterminate) {
        <span class="ui-progress__value">{{ valueText }}</span>
      }
    </div>
  }

  <div
    class="ui-progress__track"
    [class.ui-progress__track--sm]="size === 'sm'"
    [class.ui-progress__track--md]="size === 'md'"
    [class.ui-progress__track--brand]="variant === 'brand'"
    [class.ui-progress__track--success]="variant === 'success'"
    [class.ui-progress__track--warning]="variant === 'warning'"
    [class.ui-progress__track--danger]="variant === 'danger'"
    [class.ui-progress__track--indeterminate]="indeterminate"
    role="progressbar"
    [attr.aria-label]="label || ariaLabel"
    [attr.aria-valuemin]="0"
    [attr.aria-valuemax]="safeMax"
    [attr.aria-valuenow]="indeterminate ? null : safeValue"
    [attr.aria-valuetext]="indeterminate ? null : valueText"
  >
    <div
      class="ui-progress__bar"
      [style.width.%]="indeterminate ? null : percentage"
    ></div>
  </div>
</div>
