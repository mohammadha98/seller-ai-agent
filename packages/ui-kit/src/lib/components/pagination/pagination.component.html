<nav
  class="ui-pagination"
  [class.ui-pagination--sm]="size === 'sm'"
  [class.ui-pagination--md]="size === 'md'"
  [attr.aria-label]="ariaLabel"
>
  <button
    class="ui-pagination__nav"
    type="button"
    aria-label="Previous page"
    [disabled]="disabled || currentPage <= 1"
    (click)="goTo(currentPage - 1)"
  >
    <svg
      aria-hidden="true"
      viewBox="0 0 20 20"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="m12 5-5 5 5 5" />
    </svg>
  </button>

  @for (item of items; track item.key) {
    @if (item.page === null) {
      <span class="ui-pagination__ellipsis" aria-hidden="true">{{ item.label }}</span>
    } @else {
      <button
        class="ui-pagination__page"
        [class.ui-pagination__page--active]="item.page === currentPage"
        type="button"
        [disabled]="disabled"
        [attr.aria-current]="item.page === currentPage ? 'page' : null"
        [attr.aria-label]="'Page ' + item.page"
        (click)="goTo(item.page)"
      >
        {{ item.label }}
      </button>
    }
  }

  <button
    class="ui-pagination__nav"
    type="button"
    aria-label="Next page"
    [disabled]="disabled || currentPage >= normalizedPageCount"
    (click)="goTo(currentPage + 1)"
  >
    <svg
      aria-hidden="true"
      viewBox="0 0 20 20"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="m8 5 5 5-5 5" />
    </svg>
  </button>
</nav>
